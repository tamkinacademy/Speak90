<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SPEAK90 · অ্যাডমিন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060912;--card:#0f1424;--line:#ffffff14;--line2:#ffffff26;--text:#e9edf7;--mute:#98a1b8;--a:#5eead4;--b:#60a5fa;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Hind Siliguri',sans-serif;font-size:16px;line-height:1.6;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.logo{font-family:'Montserrat',sans-serif;font-weight:800;letter-spacing:.12em}.logo b{color:var(--a)}
button,input{font-family:inherit}
.btn{border:0;cursor:pointer;border-radius:99px;padding:8px 18px;font-weight:600;font-size:14px;background:linear-gradient(120deg,var(--a),var(--b));color:#04121a}
.btn.g{background:none;border:1px solid var(--line2);color:var(--text)}
.btn.ok{background:var(--ok)}.btn.bad{background:none;border:1px solid var(--bad);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.inp{width:100%;background:#00000040;border:1px solid var(--line2);border-radius:12px;padding:11px 14px;color:var(--text);font-size:16px;margin-bottom:10px;outline:none}
.inp:focus{border-color:var(--a)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:6px 16px;border-radius:99px;border:1px solid var(--line2);background:none;color:var(--mute);cursor:pointer;font-size:14px}
.tab.on{border-color:var(--a);color:var(--a);background:#5eead414}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.meta{color:var(--mute);font-size:14px}
.code{font-family:'Montserrat',sans-serif;letter-spacing:.1em;color:var(--a);font-weight:700}
.tag{font-size:12px;border-radius:99px;padding:1px 10px;border:1px solid}
.tag.pending{color:var(--warn);border-color:#fbbf2466}.tag.approved{color:var(--ok);border-color:#34d39966}.tag.rejected{color:var(--bad);border-color:#f8717166}
.login{max-width:380px;margin:12vh auto}
.msg{color:var(--bad);font-size:14px;margin-top:8px}
h3{font-size:18px;margin-bottom:10px}
.nav2{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.nav2 button{background:none;border:0;color:var(--mute);font-size:16px;padding:6px 14px;cursor:pointer;border-radius:10px}
.nav2 button.on{color:var(--a);background:#5eead414}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;text-align:left;border-top:1px solid var(--line);font-size:14px;vertical-align:top}th{color:var(--mute);font-weight:500;border-top:0}
.warn{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="vocab.js"></script><script src="qbank.js"></script><script src="exam.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyD1uWle_USBMBO_rJuT64TMCmmzyO1rdH8",authDomain:"techcraft-gigs.firebaseapp.com",projectId:"techcraft-gigs",storageBucket:"techcraft-gigs.firebasestorage.app",messagingSenderId:"402779044950",appId:"1:402779044950:web:f728c347d9d23d18b48ff7"}),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const newCode=()=>{const a=new Uint8Array(8);crypto.getRandomValues(a);return 'S90-'+[...a].map(x=>chars[x%chars.length]).join('')};
let rows=[],tab='pending',view='cert',exams=[],curEx=null,exRes=[];
const rid8=()=>{const a=new Uint8Array(6);crypto.getRandomValues(a);return 'E'+[...a].map(x=>chars[x%chars.length]).join('')};
const dfmt=ms=>ms?new Date(+ms).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'}):'';
function login(m){
  A.innerHTML=`<div class="card login"><div class="logo" style="margin-bottom:14px">SPEAK<b>90</b> · অ্যাডমিন</div>
   <input class="inp" id="e" type="email" placeholder="ইমেইল" autocomplete="username"><input class="inp" id="p" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
   <button class="btn" id="g" style="width:100%">লগইন</button><div class="msg" id="m">${esc(m||'')}</div></div>`;
  $('#g').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#e').value.trim(),$('#p').value)}catch(e){$('#m').textContent='ইমেইল বা পাসওয়ার্ড ভুল'}};
}
async function load(){
  const s=await getDocs(collection(db,'sp_cert'));rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));
  const e=await getDocs(collection(db,'sp_exam'));exams=e.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.start-a.start);
  draw();
}
function shell(inner){
  A.innerHTML=`<div class="top"><div class="logo">SPEAK<b>90</b> · অ্যাডমিন</div><button class="btn g" id="lo">লগআউট</button></div>
   <div class="nav2"><button data-v="cert" class="${view==='cert'?'on':''}">🎓 সার্টিফিকেট আবেদন</button><button data-v="exam" class="${view==='exam'||view==='res'?'on':''}">📝 পরীক্ষা</button></div>${inner}`;
  $('#lo').onclick=()=>signOut(auth);
  document.querySelectorAll('.nav2 button').forEach(b=>b.onclick=()=>{view=b.dataset.v;draw()});
}
function draw(){view==='exam'?drawExam():view==='res'?drawRes():drawCert()}

/* ----- সার্টিফিকেট আবেদন ----- */
function drawCert(){
  const cnt=s=>rows.filter(r=>r.status===s).length;
  const list=rows.filter(r=>r.status===tab);
  shell(`<div class="tabs">${[['pending','অপেক্ষায়'],['approved','অনুমোদিত'],['rejected','বাতিল']].map(([k,n])=>`<button class="tab${tab===k?' on':''}" data-t="${k}">${n} (${cnt(k)})</button>`).join('')}</div>
   <div class="card"><h3>➕ সরাসরি সার্টিফিকেট দাও</h3><input class="inp" id="nn" placeholder="নাম"><input class="inp" id="np" placeholder="মোবাইল (ঐচ্ছিক)"><button class="btn" id="ng">সার্টিফিকেট তৈরি করো</button><div class="meta" id="nm" style="margin-top:8px"></div></div>
   ${list.length?list.map(r=>`<div class="card" data-id="${esc(r.id)}">
     <div class="row" style="margin-top:0"><span class="code">${esc(r.code||r.id)}</span><span class="tag ${esc(r.status)}">${r.status==='pending'?'অপেক্ষায়':r.status==='approved'?'অনুমোদিত':'বাতিল'}</span>${r.type==='merit'?'<span class="tag approved">🏆 মেধা</span>':''}<span class="meta">${dfmt(r.at)}</span></div>
     <input class="inp nm" value="${esc(r.name)}" style="margin-top:10px" aria-label="নাম">
     <div class="meta">📞 ${esc(r.phone)} · ${r.type==='merit'?esc(r.title||'')+' · '+esc(r.score)+'/'+esc(r.total):'পাঠ শেষ: '+esc(r.done)+'/৯০'}${r.no?' · নং '+esc(r.no):''}</div>
     <div class="row">
       ${r.status!=='approved'?'<button class="btn ok" data-a="ok">✓ অনুমোদন</button>':''}
       ${r.status==='pending'?'<button class="btn bad" data-a="no">✕ বাতিল</button>':''}
       <a class="btn g" style="text-decoration:none" target="_blank" href="index.html?c=${esc(r.code||r.id)}">সার্টিফিকেট দেখো</a>
       ${r.phone?`<a class="btn g" style="text-decoration:none" target="_blank" href="https://wa.me/88${esc(String(r.phone).replace(/\D/g,'').replace(/^88/,''))}?text=${encodeURIComponent('আপনার SPEAK90 সার্টিফিকেট প্রস্তুত। কোড: '+(r.code||r.id))}">WhatsApp</a>`:''}
       <button class="btn g" data-a="del">মুছো</button></div></div>`).join(''):'<div class="meta" style="padding:24px;text-align:center">কিছু নেই</div>'}`);
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
  $('#ng').onclick=async()=>{
    const name=$('#nn').value.trim(),ph=$('#np').value.trim();if(name.length<2){$('#nm').textContent='নাম লিখুন';return}
    const code=newCode(),no='S90-'+String(rows.filter(r=>r.status==='approved').length+1).padStart(4,'0');
    await setDoc(doc(db,'sp_cert',code),{code,name,phone:ph,done:90,status:'approved',at:Date.now(),issuedAt:Date.now(),no});
    await load();tab='approved';draw();
  };
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    const card=b.closest('.card'),id=card.dataset.id,name=card.querySelector('.nm').value.trim(),a=b.dataset.a;
    if(a==='del'){if(!confirm('মুছে ফেলবে?'))return;await deleteDoc(doc(db,'sp_cert',id))}
    else if(a==='ok'){const no='S90-'+String(rows.filter(r=>r.status==='approved').length+1).padStart(4,'0');await updateDoc(doc(db,'sp_cert',id),{status:'approved',name,issuedAt:Date.now(),no})}
    else if(a==='no'){await updateDoc(doc(db,'sp_cert',id),{status:'rejected',name})}
    await load();
  });
}

/* ----- পরীক্ষা ----- */
function drawExam(){
  const loc=ms=>{const d=new Date(ms),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};
  const now=Date.now();
  shell(`<div class="card"><h3>➕ নতুন পরীক্ষা</h3>
    <label>পরীক্ষার নাম</label><input class="inp" id="xt" placeholder="যেমন: সাপ্তাহিক পরীক্ষা ১">
    <div class="grid2"><div><label>শুরু</label><input class="inp" id="xs" type="datetime-local" value="${loc(now+3600e3)}"></div><div><label>শেষ (এর পরে আর জমা নেবে না)</label><input class="inp" id="xe" type="datetime-local" value="${loc(now+3*86400e3)}"></div>
    <div><label>সময় (মিনিট)</label><input class="inp" id="xm" type="number" value="20"></div><div><label>প্রশ্ন সংখ্যা</label><input class="inp" id="xn" type="number" value="30"></div>
    <div><label>মেধা সার্টিফিকেটের নূন্যতম নম্বর</label><input class="inp" id="xp" type="number" value="24"></div><div><label>কমপক্ষে কতটা পাঠ শেষ থাকতে হবে (০ = শর্ত নেই)</label><input class="inp" id="xd" type="number" value="0"></div></div>
    <label>পুরস্কারের বিবরণ</label><input class="inp" id="xz" placeholder="যেমন: ১ম ৫০০ টাকা, ২য় ৩০০ টাকা, ৩য় ২০০ টাকা">
    <button class="btn" id="xg">পরীক্ষা তৈরি করো</button><div class="meta" id="xm2" style="margin-top:8px"></div></div>
   ${exams.length?exams.map(x=>`<div class="card" data-x="${esc(x.id)}"><h3>${esc(x.title)} <span class="tag ${x.status==='closed'?'rejected':'approved'}">${x.status==='closed'?'বন্ধ':'চালু'}</span> ${x.pub?'<span class="tag approved">ফল প্রকাশিত</span>':''}</h3>
     <div class="meta">${dfmt(x.start)} → ${dfmt(x.end)} · ${esc(x.mins)} মি · ${esc(x.n)} প্রশ্ন · মেধা: ${esc(x.pass)}+ · পাঠ শর্ত: ${esc(x.minDays||0)}</div><div class="meta">🏆 ${esc(x.prize||'')}</div>
     <div class="row"><button class="btn" data-r="${esc(x.id)}">ফলাফল দেখো</button><button class="btn g" data-tg="status">${x.status==='closed'?'আবার চালু করো':'বন্ধ করো'}</button><button class="btn g" data-tg="pub">${x.pub?'ফল লুকাও':'ফল প্রকাশ করো'}</button><button class="btn g" data-dx="1">মুছো</button></div></div>`).join(''):'<div class="meta" style="padding:24px;text-align:center">কোনো পরীক্ষা নেই</div>'}`);
  $('#xg').onclick=async()=>{
    const t=$('#xt').value.trim(),s=new Date($('#xs').value).getTime(),e=new Date($('#xe').value).getTime(),m=+$('#xm').value,n=+$('#xn').value;
    if(t.length<2||!s||!e||e<=s||m<1||n<5||n>60){$('#xm2').textContent='সব ঘর ঠিকমতো পূরণ করো (প্রশ্ন ৫ থেকে ৬০)';return}
    const id=rid8();
    await setDoc(doc(db,'sp_exam',id),{title:t,start:s,end:e,mins:m,n,pass:+$('#xp').value||0,minDays:+$('#xd').value||0,prize:$('#xz').value.trim(),seed:id+Math.random().toString(36).slice(2,8),status:'open',pub:false});
    await load();
  };
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{curEx=exams.find(x=>x.id===b.dataset.r);view='res';await loadRes();draw()});
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const id=b.closest('.card').dataset.x,x=exams.find(z=>z.id===id);
    await updateDoc(doc(db,'sp_exam',id),b.dataset.tg==='status'?{status:x.status==='closed'?'open':'closed'}:{pub:!x.pub});await load()});
  document.querySelectorAll('[data-dx]').forEach(b=>b.onclick=async()=>{if(!confirm('পরীক্ষা মুছবে? ফলাফল থেকে যাবে।'))return;await deleteDoc(doc(db,'sp_exam',b.closest('.card').dataset.x));await load()});
}
async function loadRes(){
  const [a,b]=await Promise.all([getDocs(collection(db,'sp_res')),getDocs(collection(db,'sp_resp'))]);
  const priv={};b.docs.forEach(d=>priv[d.id]=d.data());
  exRes=a.docs.map(d=>({id:d.id,...d.data(),p:priv[d.id]||{}})).filter(r=>r.exam===curEx.id).sort((x,y)=>y.score-x.score||x.secs-y.secs);
}
function verify(r){
  try{const ans=String(r.p.ans||'').split('').map(c=>c==='-'?undefined:+c);return window.EXAM.score(curEx.seed,curEx.n,ans)}catch(e){return null}
}
function drawRes(){
  const x=curEx;
  shell(`<div class="top"><h3 style="margin:0">${esc(x.title)} · ফলাফল (${exRes.length}জন)</h3><button class="btn g" id="bk">← পরীক্ষার তালিকা</button></div>
   <div class="card" style="overflow-x:auto"><table><tr><th>#</th><th>নাম / ফোন</th><th>নম্বর</th><th>সময়</th><th>যাচাই</th><th></th></tr>
   ${exRes.map((r,i)=>{const v=verify(r),bad=v!==null&&v!==r.score;return `<tr data-id="${esc(r.id)}"><td>${i+1}</td><td><b>${esc(r.name)}</b><br><span class="meta">${esc(r.p.phone||'')}</span>${r.cert?'<br><span class="code">'+esc(r.cert)+'</span>':''}</td><td>${esc(r.score)}/${esc(r.total)}</td><td>${Math.floor(r.secs/60)}মি ${r.secs%60}সে${r.p.blur?'<br><span class="warn">⚠ পাতা বদলেছে '+esc(r.p.blur)+' বার</span>':''}</td>
     <td>${v===null?'-':bad?'<span class="warn">⚠ আসল '+v+'</span>':'✓'}</td>
     <td><div class="row" style="margin:0">${x.pass&&r.score>=x.pass&&!r.cert?'<button class="btn ok" data-m="1">🏆 সার্টিফিকেট</button>':''}${r.p.phone?`<a class="btn g" style="text-decoration:none" target="_blank" href="https://wa.me/88${esc(String(r.p.phone).replace(/\D/g,'').replace(/^88/,''))}?text=${encodeURIComponent('অভিনন্দন! আপনি '+x.title+'-এ '+r.score+'/'+r.total+' পেয়েছেন (র‍্যাংক '+(i+1)+')।'+(r.cert?' আপনার সার্টিফিকেট কোড: '+r.cert:''))}">WhatsApp</a>`:''}${bad?'<button class="btn bad" data-fx="1">নম্বর ঠিক করো</button>':''}<button class="btn g" data-d="1">মুছো</button></div></td></tr>`}).join('')||'<tr><td colspan="6" class="meta">কেউ অংশ নেয়নি</td></tr>'}</table></div>`);
  $('#bk').onclick=()=>{view='exam';draw()};
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{
    const id=b.closest('tr').dataset.id,i=exRes.findIndex(r=>r.id===id),r=exRes[i];
    const code=newCode(),no='S90-M'+String(rows.filter(z=>z.type==='merit').length+1).padStart(3,'0');
    await setDoc(doc(db,'sp_cert',code),{code,name:r.name,phone:r.p.phone||'',done:r.score,status:'approved',at:Date.now(),issuedAt:Date.now(),no,type:'merit',rank:i+1,score:r.score,total:r.total,title:x.title,exam:x.id});
    await updateDoc(doc(db,'sp_res',id),{cert:code});await load();await loadRes();draw();
  });
  document.querySelectorAll('[data-fx]').forEach(b=>b.onclick=async()=>{const id=b.closest('tr').dataset.id,r=exRes.find(z=>z.id===id);await updateDoc(doc(db,'sp_res',id),{score:verify(r)});await loadRes();draw()});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('এই ফল মুছবে? তখন এই নম্বর দিয়ে আবার পরীক্ষা দেওয়া যাবে।'))return;const id=b.closest('tr').dataset.id;await deleteDoc(doc(db,'sp_res',id));try{await deleteDoc(doc(db,'sp_resp',id))}catch(e){}await loadRes();draw()});
}
onAuthStateChanged(auth,async u=>{
  if(!u)return login();
  let ok=false;try{ok=(await getDoc(doc(db,'admins',u.uid))).exists()}catch(e){}
  if(!ok){await signOut(auth);return login('এই অ্যাকাউন্টে অ্যাডমিনের অনুমতি নেই')}
  try{await load()}catch(e){A.innerHTML='<div class="card">ডেটা আনা যায়নি। Firebase Rules-এ sp_cert অংশটা বসানো হয়েছে কি না দেখো।</div>'}
});
</script>
</body>
</html>
